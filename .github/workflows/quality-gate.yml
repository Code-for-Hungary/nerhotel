---
name: Quality gate
on:
  pull_request:
    branches:
      - master
      - dev
jobs:
  quality-gate:
    name: Check code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/Jod"
      - name: Install dependencies
        run: npm ci --fund=false --audit=false
      - name: Unit tests
        run: npm run test:ci
      # - name: Code linter
      #   run: npm run lint
      - name: Check code formatting
        run: npm run format:check
